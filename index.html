<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickNotes API Client</title>

<script src="api.js" defer></script>

</head>

<body>

<h1>QuickNotes API Client</h1>


<button id="load-btn">
Load notes
</button>

<p id="status"></p>


<form id="note-form">

<label for="title">
Title
</label>

<input id="title" type="text">


<label for="body">
Body
</label>

<textarea id="body"></textarea>


<button id="submit-btn">
Create Note
</button>


</form>


<ul id="notes-list"></ul>


</body>
</html>
